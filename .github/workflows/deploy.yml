name: Deploy

# Deploys only after the CI workflow finishes green on main; manual dispatch
# is the escape hatch (it deploys the current main HEAD).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Resolve deployed commit
        id: meta
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/jesuslab135/pastoral-backend:latest
            ghcr.io/jesuslab135/pastoral-backend:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/jesuslab135/pastoral-web:latest
            ghcr.io/jesuslab135/pastoral-web:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pastoral.jesuslab135.com
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          NEW_TAG: ${{ needs.build.outputs.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NEW_TAG
          script_stop: true
          script: |
            cd /opt/pastoral
            grep -oP '(?<=^TAG=).*' .env > .tag.prev || echo latest > .tag.prev
            sed -i "s|^TAG=.*|TAG=${NEW_TAG}|" .env
            docker compose pull
            docker compose up -d
            docker image prune -f
      - name: Health check through Caddy
        run: |
          sleep 10
          curl --fail --silent --show-error \
               --retry 12 --retry-delay 10 --retry-all-errors \
               https://pastoral.jesuslab135.com/healthz
      - name: Roll back to previous tag
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/pastoral
            PREV=$(cat .tag.prev 2>/dev/null || echo latest)
            sed -i "s|^TAG=.*|TAG=${PREV}|" .env
            docker compose pull
            docker compose up -d
