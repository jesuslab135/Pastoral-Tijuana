name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pastoral
          POSTGRES_PASSWORD: pastoral
          POSTGRES_DB: pastoral_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pastoral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          version: v1.62.2
      - name: Test
        run: go test ./... -count=1
        env:
          TEST_DATABASE_URL: postgres://pastoral:pastoral@localhost:5433/pastoral_test?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx astro check
      - name: Build
        run: npm run build
